
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle, #073653, #020817 70%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.container { width: 92%; max-width: 500px; }
h1 { letter-spacing: 8px; text-shadow: 0 0 15px cyan; }
.core {
  width: 210px;
  height: 210px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: 30px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px cyan, inset 0 0 25px cyan;
  animation: glow 2s infinite alternate;
}
.core span { font-size: 65px; }
@keyframes glow {
  from { box-shadow: 0 0 10px cyan, inset 0 0 10px cyan; }
  to { box-shadow: 0 0 35px cyan, inset 0 0 30px cyan; }
}
input {
  width: 100%;
  padding: 15px;
  border: 1px solid cyan;
  border-radius: 10px;
  background: #06182b;
  color: white;
  font-size: 16px;
}
button {
  margin: 10px 5px;
  padding: 13px 20px;
  border: 1px solid cyan;
  border-radius: 10px;
  background: #063b55;
  color: white;
  font-size: 16px;
}
#answer { min-height: 50px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>J.A.R.V.I.S</h1>
  <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
  <div class="core"><span>◉</span></div>
  <p id="status">SYSTEM ONLINE</p>
  <input id="question" placeholder="Ask me anything...">
  <br>
  <button onclick="askJarvis()">ASK JARVIS</button>
  <button onclick="speakAnswer()">SPEAK</button>
  <button onclick="listen()">🎙️ SPEAK TO ME</button>
  <p id="answer">Hello Sir. I am Jarvis.</p>
</div>
<script>
function reply(text) {
  document.getElementById("answer").innerText = text;
}
function speakAnswer() {
  let text = document.getElementById("answer").innerText;
  let voice = new SpeechSynthesisUtterance(text);
  voice.lang = "en-IN";
  speechSynthesis.speak(voice);
}
function askJarvis() {
  let q = document.getElementById("question").value.toLowerCase();
  if (q.includes("hello")) reply("Hello Sir. How can I help you?");
  else if (q.includes("your name")) reply("I am Jarvis, your personal assistant.");
  else if (q.includes("how are you")) reply("I am fine Sir. All systems are online.");
  else reply("I heard you Sir. You said: " + q);
  speakAnswer();
}
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    reply("Voice recognition is not supported in this browser.");
    return;
  }
  let rec = new SR();
  rec.lang = "en-IN";
  rec.onstart = () => document.getElementById("status").innerText = "LISTENING...";
  rec.onresult = e => {
    document.getElementById("question").value = e.results[0][0].transcript;
    askJarvis();
  };
  rec.onerror = e => reply("Microphone error: " + e.error);
  rec.onend = () => document.getElementById("status").innerText = "SYSTEM ONLINE";
  rec.start();
}
</script>
</body>
</html>
